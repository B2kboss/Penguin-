<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PenguinEarn - Admin Control Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      padding: 15px;
      padding-bottom: 50px;
    }

    /* Admin Login Screen */
    #login-screen {
      max-width: 380px;
      margin: 80px auto;
      background: #111827;
      padding: 30px 20px;
      border-radius: 16px;
      border: 1px solid #1f2937;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #login-screen h2 {
      font-size: 20px;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    #login-screen p {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    .input-box {
      width: 100%;
      background: #0b0f19;
      border: 1px solid #374151;
      padding: 12px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 15px;
      outline: none;
      text-align: center;
    }

    .btn-login {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    /* Dashboard Layout */
    #admin-dashboard {
      display: none;
      max-width: 600px;
      margin: 0 auto;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Admin Stats Grid */
    .admin-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .admin-stat-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 18px 15px;
      text-align: center;
      cursor: pointer;
    }

    .admin-stat-card i {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .admin-stat-card h3 {
      font-size: 22px;
      color: #fff;
      font-weight: bold;
    }

    .admin-stat-card p {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }
