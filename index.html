<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PenguinEarn - Coin Ranking</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19 !important;
      color: #ffffff !important;
      padding: 15px;
      padding-bottom: 90px;
    }

    /* User Profile Header */
    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .user-info { display: flex; align-items: center; gap: 12px; }

    .user-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      overflow: hidden;
      border: 2px solid #38bdf8;
    }

    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-details h4 { font-size: 15px; color: #fff; font-weight: 700; }
    .user-details p { font-size: 11px; color: #9ca3af; }

    .coin-box {
      background: #111827;
      border: 1px solid #1f2937;
      padding: 6px 14px;
      border-radius: 12px;
      text-align: center;
    }

    .coin-box h3 { font-size: 16px; color: #38bdf8; font-weight: bold; }
    .coin-box span { font-size: 9px; color: #9ca3af; text-transform: uppercase; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Live Badge Header */
    .live-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #10b981;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 1; }
    }

    /* Leaderboard Items */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .leaderboard-item {
      background: #111827;
      border: 1px solid #1f2937;
      padding: 12px 15px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.5s ease;
    }

    .leaderboard-item.highlight-me {
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }

    .rank-badge {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
    }

    .rank-1 { background: #eab308; color: #000; box-shadow: 0 0 10px rgba(234, 179, 8, 0.4); }
    .rank-2 { background: #94a3b8; color: #000; }
    .rank-3 { background: #b45309; color: #fff; }
    .rank-other { background: #1f2937; color: #9ca3af; }

    .lb-user { display: flex; align-items: center; gap: 12px; }
    .lb-user-name { font-size: 13px; font-weight: 600; color: #fff; }
    .lb-user-coins { font-size: 14px; font-weight: 700; color: #38bdf8; }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: #0b0f19;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #1f2937;
      z-index: 1000;
    }

    .nav-item {
      background: none;
      border: none;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      cursor: pointer;
      width: 25%;
    }

    .nav-item i { font-size: 18px; }
    .nav-item.active { color: #38bdf8; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="user-header">
    <div class="user-info">
      <div class="user-avatar" id="u-avatar">D</div>
      <div class="user-details">
        <h4 id="u-name">Diego || KOL's manager</h4>
        <p>ID: <span id="u-id">7301714914</span></p>
      </div>
    </div>
    <div class="coin-box">
      <h3 id="u-coins">0</h3>
      <span>COINS</span>
    </div>
  </div>

  <!-- HOME TAB -->
  <div id="home-tab" class="tab-content">
    <div style="margin-bottom:12px; font-size:15px; font-weight:600;">⚡ Task List</div>
    <p style="font-size:12px; color:#9ca3af;">Earn coins to move up in ranks!</p>
  </div>

  <!-- WAITLIST / COIN RANKING TAB -->
  <div id="waitlist-tab" class="tab-content active">
    <div class="live-header">
      <div style="font-size:16px; font-weight:bold;">
        <i class="fas fa-trophy" style="color:#eab308;"></i> Coin Leaderboard
      </div>
      <div class="live-badge">
        <div class="live-dot"></div> LIVE RANKS
      </div>
    </div>

    <!-- Live Leaderboard List -->
    <div class="leaderboard-list" id="leaderboard-container"></div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-item" onclick="switchTab('home-tab', this)">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </button>
    <button class="nav-item active" onclick="switchTab('waitlist-tab', this)">
      <i class="fas fa-trophy"></i>
      <span>Waitlist</span>
    </button>
  </div>

  <script>
    //<![CDATA[
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    // Current Real User Data
    let currentUser = {
      id: "7301714914",
      name: "Diego || KOL's manager",
      coins: 0
    };

    // User List with Coins
    let usersList = [
      { id: "u_1", name: "Crypto King 👑", coins: 152000 },
      { id: "u_2", name: "Alex Crypto", coins: 134500 },
      { id: "u_3", name: "Sabbir Hossain BD", coins: 98100 },
      { id: "u_4", name: "Elena Rostova", coins: 85200 },
      { id: "u_5", name: "Rahim Ahmed", coins: 64100 },
      { id: "u_6", name: "Tanvir Hasan", coins: 42000 },
      { id: "u_7", name: "Viktor_Ton", coins: 31500 }
    ];

    window.addEventListener('DOMContentLoaded', function() {
      // Sync Real Telegram Profile Data
      const tgUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
      if (tgUser) {
        currentUser.id = tgUser.id.toString();
        currentUser.name = tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '');
        document.getElementById('u-name').innerText = currentUser.name;
        document.getElementById('u-id').innerText = currentUser.id;
        if (tgUser.photo_url) {
          document.getElementById('u-avatar').innerHTML = '<img src="' + tgUser.photo_url + '"/>';
        } else {
          document.getElementById('u-avatar').innerText = tgUser.first_name.charAt(0);
        }
      }

      // Add Current User to the Coin List
      usersList.push(currentUser);

      // Render Leaderboard initially
      updateLeaderboard();

      // Live updates for Coin Ranks every 3 seconds
      setInterval(simulateLiveCoinChanges, 3000);
    });

    function updateLeaderboard() {
      // Sort users strictly by Coin Count (Highest to Lowest)
      usersList.sort((a, b) => b.coins - a.coins);

      const container = document.getElementById('leaderboard-container');
      container.innerHTML = '';

      usersList.forEach((user, index) => {
        const rank = index + 1;
        let rankClass = "rank-other";
        if (rank === 1) rankClass = "rank-1";
        else if (rank === 2) rankClass = "rank-2";
        else if (rank === 3) rankClass = "rank-3";

        const isMe = user.id === currentUser.id;

        const item = document.createElement('div');
        item.className = 'leaderboard-item' + (isMe ? ' highlight-me' : '');
        item.innerHTML = `
          <div class="lb-user">
            <div class="rank-badge ${rankClass}">#${rank}</div>
            <div class="lb-user-name">${user.name} ${isMe ? ' <span style="color:#38bdf8; font-size:11px;">(You)</span>' : ''}</div>
          </div>
          <div class="lb-user-coins">${user.coins.toLocaleString()} Coins</div>
        `;
        container.appendChild(item);
      });
    }

    // Live Coin Increase Generator
    function simulateLiveCoinChanges() {
      // Select a random user (except current real user) to add coins
      const otherUsers = usersList.filter(u => u.id !== currentUser.id);
      const randomUser = otherUsers[Math.floor(Math.random() * otherUsers.length)];
      
      // Add random 100 to 500 coins
      randomUser.coins += Math.floor(Math.random() * 5 + 1) * 100;

      // Re-sort and render to show new Coin Ranking
      updateLeaderboard();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }
    //]]>
  </script>
</body>
</html>
